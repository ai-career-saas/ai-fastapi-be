name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for deploy to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Polling Render for deploy status..."
          for i in $(seq 1 30); do
            RESPONSE=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1")
            STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['deploy']['status'])")
            echo "Attempt $i: status=$STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "Deploy succeeded."
              exit 0
            fi

            if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "Deploy failed with status: $STATUS"
              exit 1
            fi

            sleep 15
          done
          echo "Timed out waiting for deploy to finish."
          exit 1

      - name: Health check
        env:
          HEALTH_CHECK_URL: ${{ secrets.RENDER_HEALTH_CHECK_URL }}
        run: |
          if [ -z "$HEALTH_CHECK_URL" ]; then
            echo "No RENDER_HEALTH_CHECK_URL secret set, skipping health check."
            exit 0
          fi
          curl -f "$HEALTH_CHECK_URL"
